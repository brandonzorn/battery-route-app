<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B2234" />
      <stop offset="50%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>
    <radialGradient id="cyanAmbient" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetAmbient" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="routeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="40%" stop-color="#7B2CBF" />
      <stop offset="80%" stop-color="#FF2A55" />
      <stop offset="100%" stop-color="#FF6B4A" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A55" />
      <stop offset="100%" stop-color="#FF6B4A" />
    </linearGradient>
    <linearGradient id="arrowFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
    <g id="arrow">
      <path d="M 0,-32 L 20,16 L 0,6 L -20,16 Z" fill="url(#arrowGrad)" />
      <path d="M 0,-32 L -20,16 L 0,6 Z" fill="url(#arrowFacet)" />
      <path d="M 0,-32 L 20,16 L 0,6 Z" fill="#FFFFFF" opacity="0.2" />
    </g>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="115" />
    </clipPath>
  </defs>
  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="url(#bgGrad)" />
    <rect width="512" height="512" fill="url(#cyanAmbient)" />
    <rect width="512" height="512" fill="url(#violetAmbient)" />
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2">
      <path id="topoLine" d="M -20,210 Q 120,150 260,220 T 540,180" />
      <use href="#topoLine" y="70" />
      <use href="#topoLine" y="140" />
      <use href="#topoLine" y="210" />
    </g>
    <g transform="translate(256, 256) scale(1.15) translate(-256, -256)">
      <path d="M 140,360 C 140,230 230,230 256,256 C 282,282 372,282 372,163" fill="none"
        stroke="url(#routeGrad)" stroke-width="22" stroke-linecap="round" />
      <circle cx="140" cy="360" r="14" fill="#00E5FF" />
      <circle cx="140" cy="360" r="6" fill="#FFFFFF" />
      <use href="#arrow" x="372" y="152" />
    </g>
    <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#FFFFFF"
      stroke-opacity="0.1" stroke-width="2" />
  </g>
